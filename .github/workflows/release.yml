name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  export-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_TEMPLATE_DIR: ${{ github.workspace }}/.godot-templates/4.7.2.stable.mono
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate tag and repository
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.tag }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo 'Tag must look like v1.2.3'; exit 2; }
          python tools/validate_repo.py

      - name: Restore and build
        run: |
          dotnet restore Backrooms.Infinity.csproj
          dotnet build Backrooms.Infinity.csproj -c Release --no-restore

      - name: Download Godot .NET editor and .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=mono_linux_x86_64.zip&version=4.7.2' -o godot-dotnet.zip
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=mono_export_templates.tpz&version=4.7.2' -o godot-templates.tpz
          mkdir -p .godot-ci .template-unpack "$GODOT_TEMPLATE_DIR"
          unzip -q godot-dotnet.zip -d .godot-ci
          unzip -q godot-templates.tpz -d .template-unpack
          cp -a .template-unpack/templates/. "$GODOT_TEMPLATE_DIR/"
          # Godot also checks the standard version directory on some builds.
          mkdir -p "$HOME/.local/share/godot/export_templates"
          rm -rf "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          cp -a "$GODOT_TEMPLATE_DIR" "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          GODOT_BIN="$(find .godot-ci -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import and export single application
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit
          mkdir -p build/win-x64 build/linux-x64 build/macos-universal dist
          "$GODOT_BIN" --headless --path . --export-release 'Windows x86_64' build/win-x64/Backrooms-Infinity.exe
          "$GODOT_BIN" --headless --path . --export-release 'Linux x86_64' build/linux-x64/Backrooms-Infinity.x86_64
          "$GODOT_BIN" --headless --path . --export-release 'macOS Universal' build/macos-universal/Backrooms-Infinity.zip
          chmod +x build/linux-x64/Backrooms-Infinity.x86_64 || true
          (cd build/win-x64 && zip -qr ../../dist/Backrooms-win-x64.zip .)
          (cd build/linux-x64 && zip -qr ../../dist/Backrooms-linux-x64.zip .)
          cp build/macos-universal/Backrooms-Infinity.zip dist/Backrooms-macos-universal.zip
          zip -qr dist/Backrooms-user-assets.zip assets/menu assets/common
          cp installer.ps1 installer.sh dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create '${{ inputs.tag }}' dist/* --title 'Backrooms Infinity ${{ inputs.tag }}' --generate-notes --target '${{ github.sha }}'
