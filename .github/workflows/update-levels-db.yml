name: Update levels database

on:
  workflow_dispatch:
    inputs:
      name:
        description: Displayed level name
        required: true
        type: string
      preview:
        description: Absolute HTTP(S) preview URL
        required: true
        type: string
      download_link:
        description: Absolute HTTP(S) level ZIP URL
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update SQLite catalog
        env:
          LEVEL_NAME: ${{ inputs.name }}
          LEVEL_PREVIEW: ${{ inputs.preview }}
          LEVEL_DOWNLOAD: ${{ inputs.download_link }}
        run: |
          python tools/update_catalog.py "$LEVEL_NAME" "$LEVEL_PREVIEW" "$LEVEL_DOWNLOAD"
          python tools/validate_repo.py

      - name: Commit catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add levels.db.zip data/catalog.json
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
            exit 0
          fi
          git commit -m "catalog: update ${{ inputs.name }}"
          git push
