name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository, level ZIPs and catalog
        run: python tools/validate_repo.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Backrooms.Infinity.csproj

      - name: Build Debug
        run: dotnet build Backrooms.Infinity.csproj -c Debug --no-restore

      - name: Build Release
        run: dotnet build Backrooms.Infinity.csproj -c Release --no-restore

      - name: Verify managed/native NuGet runtime dependencies are copied
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find bin/Debug -type f -name 'Microsoft.Data.Sqlite.dll' -print -quit)"
          test -n "$(find bin/Debug -type f \( -name 'libe_sqlite3.so' -o -name 'e_sqlite3.dll' -o -name 'libe_sqlite3.dylib' \) -print -quit)"
          test -n "$(find bin/Debug -type f -name 'MoonSharp.Interpreter.dll' -print -quit)"

      - name: Download Godot 4.7.2 .NET editor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=mono_linux_x86_64.zip&version=4.7.2' -o godot-dotnet.zip
          mkdir -p .godot-ci
          unzip -q godot-dotnet.zip -d .godot-ci
          GODOT_BIN="$(find .godot-ci -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Godot import check
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Godot startup smoke test
        run: '"$GODOT_BIN" --headless --path . --quit-after 3'
